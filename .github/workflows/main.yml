#########################################################
# This file is generated using make-workflow.r3 script! #
#########################################################

name: 'Rebol CI'
on: 
  # Triggers the workflow on push or pull request events for specified branches
  push:
    branches: 
      - master
    paths:
      - make/**
      - src/**
      - '!src/tests/**'
      - .github/workflows/main.yml

  pull_request:
    branches: 
      - master
    paths:
      - make/**
      - src/**
      - '!src/tests/**'
      - .github/workflows/main.yml


  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

jobs:
  windows:
    strategy:
      fail-fast: true
    runs-on: windows-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v5
    - name: Install Siskin Builder
      uses: oldes/install-siskin@v0.22.5
    - name: Set env var using workspace path
      run: |
        echo "SISKIN_INSTALL=$GITHUB_WORKSPACE/install" >> $GITHUB_ENV
        echo "SISKIN_TEMP=$GITHUB_WORKSPACE/temp" >> $GITHUB_ENV
    
    - name: "[BUILD] Blend2D static library x86"
      run: ./siskin make/blend2d.nest cmake-blend2d-x86
    - name: "[BUILD] Blend2D static library x64"
      run: ./siskin make/blend2d.nest cmake-blend2d-x64

    - name: "[BUILD] Rebol/Bulk x86"
      run: ./siskin make/rebol3.nest -o ./ --msvc rebol3-bulk-windows-x86
    - name: "[BUILD] Rebol/Bulk x64"
      run: ./siskin make/rebol3.nest -o ./ --msvc rebol3-bulk-windows-x64

    - name: "[TEST] rebol3-bulk-windows-x64 ./src/tests/run-tests.r3"
      run: ./rebol3-bulk-windows-x64 -s ./src/tests/run-tests.r3
    - name: "[TEST] rebol3-bulk-windows-x64 ./src/tests/test-extension-sqlite.r3"
      run: ./rebol3-bulk-windows-x64 -s ./src/tests/test-extension-sqlite.r3
    - name: "[TEST] rebol3-bulk-windows-x64 ./src/tests/test-extension-qoi.r3"
      run: ./rebol3-bulk-windows-x64 -s ./src/tests/test-extension-qoi.r3
    - name: "[TEST] rebol3-bulk-windows-x64 ./src/tests/test-extension-triangulate.r3"
      run: ./rebol3-bulk-windows-x64 -s ./src/tests/test-extension-triangulate.r3
    - name: "[TEST] rebol3-bulk-windows-x64 ./src/tests/test-extension-blend2d.r3"
      run: ./rebol3-bulk-windows-x64 -s ./src/tests/test-extension-blend2d.r3

    - uses: actions/upload-artifact@v5
      with:
        name: Rebol CI-${{github.run_id}}-windows
        path: ./rebol3-*.exe

  linux:
    strategy:
      fail-fast: true
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v5
    - name: Install Siskin Builder
      uses: oldes/install-siskin@v0.22.5
    - name: Set env var using workspace path
      run: |
        echo "SISKIN_INSTALL=$GITHUB_WORKSPACE/install" >> $GITHUB_ENV
        echo "SISKIN_TEMP=$GITHUB_WORKSPACE/temp" >> $GITHUB_ENV
    
    - name: "[BUILD] Blend2D static library x64"
      run: ./siskin make/blend2d.nest cmake-blend2d-x64

    - name: "[BUILD] Rebol/Bulk x64"
      run: ./siskin make/rebol3.nest -o ./ --gzip rebol3-bulk-linux-x64

    - name: "[TEST] rebol3-bulk-linux-x64 ./src/tests/run-tests.r3"
      run: ./rebol3-bulk-linux-x64 -s ./src/tests/run-tests.r3
    - name: "[TEST] rebol3-bulk-linux-x64 ./src/tests/test-extension-sqlite.r3"
      run: ./rebol3-bulk-linux-x64 -s ./src/tests/test-extension-sqlite.r3
    - name: "[TEST] rebol3-bulk-linux-x64 ./src/tests/test-extension-qoi.r3"
      run: ./rebol3-bulk-linux-x64 -s ./src/tests/test-extension-qoi.r3
    - name: "[TEST] rebol3-bulk-linux-x64 ./src/tests/test-extension-triangulate.r3"
      run: ./rebol3-bulk-linux-x64 -s ./src/tests/test-extension-triangulate.r3
    - name: "[TEST] rebol3-bulk-linux-x64 ./src/tests/test-extension-blend2d.r3"
      run: ./rebol3-bulk-linux-x64 -s ./src/tests/test-extension-blend2d.r3

    - uses: actions/upload-artifact@v5
      with:
        name: Rebol CI-${{github.run_id}}-linux
        path: ./rebol3-*.gz

  macos:
    strategy:
      fail-fast: true
    runs-on: macos-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v5
    - name: Install Siskin Builder
      uses: oldes/install-siskin@v0.22.5
    - name: Set env var using workspace path
      run: |
        echo "SISKIN_INSTALL=$GITHUB_WORKSPACE/install" >> $GITHUB_ENV
        echo "SISKIN_TEMP=$GITHUB_WORKSPACE/temp" >> $GITHUB_ENV
    
    - name: "[BUILD] Blend2D static library x64"
      run: ./siskin make/blend2d.nest cmake-blend2d-x64
    - name: "[BUILD] Blend2D static library arm64"
      run: ./siskin make/blend2d.nest cmake-blend2d-arm64

    - name: "[BUILD] Rebol/Bulk x64"
      run: ./siskin make/rebol3.nest -o ./ --gzip rebol3-bulk-macos-x64

    - name: "[TEST] rebol3-bulk-macos-x64 ./src/tests/run-tests.r3"
      run: ./rebol3-bulk-macos-x64 -s ./src/tests/run-tests.r3
    - name: "[TEST] rebol3-bulk-macos-x64 ./src/tests/test-extension-sqlite.r3"
      run: ./rebol3-bulk-macos-x64 -s ./src/tests/test-extension-sqlite.r3
    - name: "[TEST] rebol3-bulk-macos-x64 ./src/tests/test-extension-qoi.r3"
      run: ./rebol3-bulk-macos-x64 -s ./src/tests/test-extension-qoi.r3
    - name: "[TEST] rebol3-bulk-macos-x64 ./src/tests/test-extension-triangulate.r3"
      run: ./rebol3-bulk-macos-x64 -s ./src/tests/test-extension-triangulate.r3
    - name: "[TEST] rebol3-bulk-macos-x64 ./src/tests/test-extension-blend2d.r3"
      run: ./rebol3-bulk-macos-x64 -s ./src/tests/test-extension-blend2d.r3

    - uses: actions/upload-artifact@v5
      with:
        name: Rebol CI-${{github.run_id}}-macos
        path: ./rebol3-*.gz
